<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlossFinder</title>
    <link id="mainCss" rel="stylesheet" href="css/style.css" />

    <script>
      // Get the theme toggle button and the main CSS link element
      const mainCssLink = document.getElementById("mainCss");
      const currentTheme = localStorage.getItem("isDarkTheme");
      if (currentTheme === "yes") {
        mainCssLink.href = "css/darkStyle.css";
      } else {
        mainCssLink.href = "css/style.css";
      }
    </script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cookie&family=Lobster&family=Meie+Script&family=Sofia&family=Yesteryear&display=swap");
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="menu">
        <h1>GlossFinder</h1>
        <div class="topp-nav">
          <ul>
            <li><a href="naglar.html" class="menu-naglar">Nails</a></li>
            <li><a href="about.html" class="menu-about">About us</a></li>
          </ul>
          <button
            type="button"
            id="theme-toggle"
            data-theme-toggle
            aria-label="Change to light theme"
          >
            Toggle theme
          </button>
        </div>
      </nav>
    </header>
    <main>
      <div class="hero">
        <h2>Welcome to GlossFinder</h2>
        <h3>Find your next design</h3>
        <div class="get-started"><a href="naglar.html">Get started</a></div>
      </div>
      <h2 class="trending-nails">Trending Nails</h2>
      <div class="manicure-container">
        <a href="naglar.html"
          ><img
            class="top-rated-image"
            src="/bilder/gul och rosa trending nail.jpg"
            alt="trending1"
          />
        </a>
        <a href="naglar.html"
          ><img
            class="top-rated-image"
            src="/bilder/guld trending nail.jpg"
            alt="trending2"
          />
        </a>
        <a href="naglar.html"
          ><img
            class="top-rated-image"
            src="/bilder/vit trending nail.jpg"
            alt="trending3"
          />
        </a>
      </div>
    </main>
    <footer>
      <div class="footer-container">
        <section class="kontakt info">
          <a href="https://www.youtube.com" target="_blank">
            <i class="fab fa-youtube"></i>
          </a>

          <a href="https://www.instagram.com" target="_blank">
            <i class="fab fa-instagram"></i>
          </a>

          <a href="https://www.facebook.com" target="_blank">
            <i class="fab fa-facebook"></i>
          </a>

          <div class="footer-text">©2026 GlossFinder. All rights reserved</div>
          <form class="kontakt">
            <label for="email">Subscribe to our newsletter:</label>
            <input
              type="email"
              id="emailadress"
              name="email"
              placeholder="Enter your email"
              required
            />
            <button type="submit">Subscribe</button>
          </form>
        </section>
        <section>
          <div class="sticky-footer">
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="naglar.html">Nails</a></li>
              <li><a href="about.html">About us</a></li>
            </ul>
          </div>
        </section>
      </div>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
